appId: com.tuguojian0128.codexui
productName: Codex-UI
directories:
  output: release
  buildResources: assets/build
files:
  - dist/**
  - package.json
  - "!**/.env*"
  - "!**/*.enc"
extraResources:
  - from: assets/inject
    to: assets/inject
  - from: assets/presets
    to: assets/presets
  - from: assets/skills
    to: assets/skills
  - from: assets/tray
    to: assets/tray
  - from: assets/build
    to: assets/build
asarUnpack: []
fileAssociations:
  - ext: codextheme
    name: Codex-UI Theme Package
    description: Codex-UI theme package
    role: Editor
    isPackage: true
protocols:
  - name: Codex-UI
    schemes:
      - codexui
mac:
  category: public.app-category.utilities
  icon: assets/presets/blue-window-messenger/mascot.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: assets/build/entitlements.mac.plist
  entitlementsInherit: assets/build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: Codex-UI-${version}-mac-${arch}.${ext}
linux:
  category: Utility
  icon: assets/build/icon.png
  target:
    - AppImage
    - deb
  artifactName: Codex-UI-${version}-linux-x64.${ext}
win:
  icon: assets/build/icon.png
  target:
    - nsis
nsis:
  artifactName: Codex-UI-${version}-win-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: Codex-UI-${version}-${os}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: tuguojian0128
  repo: Codex-UI
